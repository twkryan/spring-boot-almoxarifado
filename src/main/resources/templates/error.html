<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Erro')}"></head>
<body>
<main class="error-page">
    <div>
        <div class="code" th:text="${status}">404</div>
        <p th:text="${status == 404} ? 'Página não encontrada.' : (${status == 403} ? 'Você não tem permissão para acessar esta página.' : 'Algo deu errado ao processar sua solicitação.')">Erro</p>
        <a class="btn btn-primary" th:href="@{/}">Voltar ao painel</a>
    </div>
</main>
</body>
</html>
